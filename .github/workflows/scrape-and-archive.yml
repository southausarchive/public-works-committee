name: Scrape Committee & Deploy Catalog

on:
  schedule:
    # Run every 20 hours to keep 24-hour SAS tokens fresh
    - cron: '0 */20 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit files to scrape (0 for unlimited)'
        required: false
        default: '0'
      wayback_batch:
        description: 'Max URLs to archive to Wayback in this run'
        required: false
        default: '40'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'catalog-sync'
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    name: Scrape & Deploy Catalog
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Manifest Cache
        uses: actions/cache@v4
        with:
          path: data/manifest.json
          key: manifest-${{ github.run_id }}
          restore-keys: |
            manifest-

      - name: Scrape Committee Documents
        run: |
          LIMIT_ARG="${{ github.event.inputs.limit || '0' }}"
          python scrape_catalog.py \
            --committee-id 451 \
            --limit "$LIMIT_ARG" \
            --delay 0.3 \
            --manifest data/manifest.json \
            --catalog-json public/data/catalog.json \
            --catalog-md CATALOG.md

      - name: Sync Permanent Archive to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          LIMIT_ARG="${{ github.event.inputs.limit || '0' }}"
          python release_archive.py "$LIMIT_ARG"

      - name: Generate SEO Landing Pages, Live Resolvers, Sitemap & Archive Index
        run: |
          python generate_seo.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  wayback-archive:
    name: Background Wayback Archiving
    needs: scrape-and-deploy
    runs-on: ubuntu-latest
    if: always() && needs.scrape-and-deploy.result == 'success'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Manifest Cache
        uses: actions/cache@v4
        with:
          path: data/manifest.json
          key: manifest-${{ github.run_id }}
          restore-keys: |
            manifest-

      - name: Archive Batch to Wayback Machine
        continue-on-error: true
        run: |
          BATCH_SIZE="${{ github.event.inputs.wayback_batch || '40' }}"
          python wayback_archive.py \
            --manifest data/manifest.json \
            --changelog public/data/changelog.json \
            --batch-size "$BATCH_SIZE" \
            --delay 8.0
