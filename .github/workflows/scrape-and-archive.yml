name: Scrape Committee & Deploy Catalog

on:
  schedule:
    # Run at midnight every day
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit files to scrape (0 for unlimited)'
        required: false
        default: '0'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: 'catalog-sync'
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    name: Scrape & Deploy Catalog
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Manifest Cache
        uses: actions/cache@v4
        with:
          path: data/manifest.json
          key: manifest-${{ github.run_id }}
          restore-keys: |
            manifest-

      - name: Scrape Committee Documents
        id: scrape
        run: |
          LIMIT_ARG="${{ github.event.inputs.limit || '0' }}"
          python scrape_catalog.py \
            --committee-id 451 \
            --limit "$LIMIT_ARG" \
            --delay 0.3 \
            --manifest data/manifest.json \
            --catalog-json public/data/catalog.json \
            --catalog-md CATALOG.md

      - name: Generate SEO Landing Pages, Live Resolvers, Sitemap & Archive Index
        run: |
          python generate_seo.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report Success Summary
        if: success()
        run: |
          echo "### ✅ Scrape & Deploy Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: Report Failure & Open Alert Issue
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const repo = context.repo;
            const runUrl = `https://github.com/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            const title = `🚨 Workflow Failure: Scrape & Deploy Catalog failed`;
            const body = `Automated GitHub Actions run failed during scraping or deployment.\n\n- **Workflow:** ${context.workflow}\n- **Run ID:** ${context.runId}\n- **Run URL:** ${runUrl}\n- **Commit:** ${context.sha}\n\nPlease check the workflow logs for details and stack traces.`;
            
            const issues = await github.rest.issues.listForRepo({
              owner: repo.owner,
              repo: repo.repo,
              state: 'open',
              labels: ['workflow-alert']
            });
            
            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: issues.data[0].number,
                body: `New failure in run ${runUrl}:\n\n${body}`
              });
            } else {
              await github.rest.issues.create({
                owner: repo.owner,
                repo: repo.repo,
                title: title,
                body: body,
                labels: ['workflow-alert', 'bug']
              });
            }
