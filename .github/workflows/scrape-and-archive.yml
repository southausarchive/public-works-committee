name: Scrape Committee & Deploy Catalog

on:
  schedule:
    # Run every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit files to scrape (0 for unlimited)'
        required: false
        default: '0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'catalog-sync'
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Manifest Cache
        uses: actions/cache@v4
        with:
          path: data/manifest.json
          key: manifest-${{ github.run_id }}
          restore-keys: |
            manifest-

      - name: Scrape Committee Documents
        run: |
          LIMIT_ARG="${{ github.event.inputs.limit || '0' }}"
          python scrape_catalog.py \
            --committee-id 451 \
            --limit "$LIMIT_ARG" \
            --delay 0.3 \
            --manifest data/manifest.json \
            --catalog-json public/data/catalog.json \
            --catalog-md CATALOG.md

      - name: Generate SEO Landing Pages, Sitemap & Robots.txt
        run: |
          python generate_seo.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
