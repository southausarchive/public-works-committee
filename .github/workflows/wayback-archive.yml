name: Background Wayback Archiving (Disabled)

on: {}
# Workflow is currently disabled. To enable, configure triggers such as schedule or workflow_dispatch.

permissions:

concurrency:
  group: 'workflow-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

  contents: write

jobs:
  wayback-archive:
    name: Background Wayback Archiving
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Manifest Cache
        uses: actions/cache@v4
        with:
          path: data/manifest.json
          key: manifest-${{ github.run_id }}
          restore-keys: |
            manifest-

      - name: Archive Batch to Wayback Machine
        continue-on-error: true
        run: |
          BATCH_SIZE="${{ github.event.inputs.wayback_batch || '40' }}"
          python wayback_archive.py \
            --manifest data/manifest.json \
            --changelog public/data/changelog.json \
            --batch-size "$BATCH_SIZE" \
            --delay 8.0